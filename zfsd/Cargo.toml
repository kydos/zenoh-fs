[package]
name = "zfsd"
version = "0.1.0"
resolver = "2"
edition = "2021"

[[bin]]
name = "zfsd"
path = "src/daemon/zfsd.rs"

[[bin]]
name = "zut"
path = "src/client/zut.rs"
[[bin]]
name = "zet"
path = "src/client/zet.rs"


[dependencies]
zenoh = { version = "1.7.2", features = ["internal", "internal_config"] }
zenoh-config = "1.7.2"
tokio = "1.49.0"
zfs = { path = "../zfs" }
clap = { version = "4.5.54", features = ["derive"] }
checksum = "0.2.1"
serde = "1.0.228"
serde_json = "1.0.149"
log = "0.4.29"
crossbeam-channel = "0.5.15"
notify = "8.2.0"
futures = "0.3.31"
env_logger = "0.11.8"
indicatif = "0.18.3"                                                      # Progress bars
uuid = "1.19.0"
derive_builder = "0.20.2"

#sled = "0.34.7" # Embedded Database
